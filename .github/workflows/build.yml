name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: GhostBlueprints
          path: build/libs/*.jar

  # The release jar targets Java 21 and the 1.21.4 API. These jobs prove the source still
  # compiles and the tests pass against newer Paper APIs (which require Java 25).
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper-api: [26.1.2.build.74-stable, 26.2.build.135-stable, 26.3.build.226-stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -PpaperApi=${{ matrix.paper-api }} -PjavaRelease=25
